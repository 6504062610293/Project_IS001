services:
  - type: web
    name: flask-ml-app
    runtime: python
    pythonVersion: 3.11.9
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
    buildCommand: "python --version && pip install --upgrade pip && pip install --no-cache-dir setuptools wheel Cython && pip install --no-cache-dir -r requirements.txt"
    startCommand: "gunicorn app:app"
